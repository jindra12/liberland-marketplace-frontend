mutation CreateOrder($data: mutationOrderInput!, $draft: Boolean!) {
    createOrder(data: $data, draft: $draft) {
        id
        status
        payerAddress
        customer {
            id
        }
        transactions {
            id
        }
        cryptoPrices {
            id
            chain
            stablePerNative
            nativePerStable
            expectedNativeAmount
            fetchedAt
        }
        currency
        amount
        customerEmail
        createdAt
        updatedAt
        items {
            id
            quantity
            parameters {
                id
                name
                values {
                    id
                    key
                    name
                    selected
                }
            }
            product {
                id
                serverURL
                name
                priceInETH
                priceInSOL
                priceInTRX
                cryptoAddresses {
                    chain
                    address
                }
                company {
                    id
                    cryptoAddresses {
                        chain
                        address
                    }
                }
            }
            variant {
                id
                title
            }
        }
        shippingAddress {
            title
            firstName
            lastName
            company
            addressLine1
            addressLine2
            city
            postalCode
            state
            country
            phone
        }
    }
}
