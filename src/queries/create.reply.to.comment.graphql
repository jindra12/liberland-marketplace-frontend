mutation CreateReplyToComment($replyToPost: Comment_ReplyPostRelationshipInput!, $parentCommentId: String!, $content: String!) {
    createComment(data: { content: $content, replyPost: $replyToPost, replyComment: $parentCommentId }) {
        id
        content
        replyComment {
            id
        }
        createdBy {
            id
            name
            email
        }
        anonymousHash
        createdAt
    }
}
