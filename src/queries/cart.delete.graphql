mutation DeleteCart($id: String!, $trash: Boolean) {
  deleteCart(id: $id, trash: $trash) {
    id
    secret
    status
    currency
    subtotal
    createdAt
    updatedAt
    purchasedAt
    customer {
      id
      name
      email
    }
    items {
      id
      quantity
      product {
        id
        serverURL
        name
        cryptoAddresses {
          chain
          address
        }
      }
      variant {
        id
        title
      }
    }
  }
}
