query VentureDeploymentRecovery($ventureId: String!, $walletAddress: String!) {
    ventureRecoveryRecord(ventureId: $ventureId, walletAddress: $walletAddress) {
        values {
            tokenName
            tokenSymbol
            initialSupply
            tokensPerEth
            deploymentNetwork
            acknowledged
        }
        transactions {
            label
            hash
            nonce
            chainId
            submittedAtBlock
        }
        progress {
            label
            hash
        }
        manifest
        saved
        runnerId
    }
}
