query CompanyById($id: String!, $draft: Boolean = false) {
    Company(id: $id, draft: $draft) {
        id
        isSubscribed
        serverURL
        name
        verification
        _status
        description
        likeCount
        cryptoAddresses {
            chain
            address
        }
        website
        phone
        email
        allowedIdentities {
            id
            serverURL
            name
            description
        }
        disallowedIdentities {
            id
            serverURL
            name
            description
        }
        createdBy {
            id
        }
        identity {
            id
            serverURL
            name
            description
            website
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
        }
        image {
            id
            url
            alt
            filename
            width
            height
            mimeType
        }
    }
}
