query ListProductsByCreator($companyIds: [JSON], $page: Int = 1, $limit: Int = 100) {
  Products(draft: true, page: $page, limit: $limit, where: { company: { in: $companyIds } }) {
    docs {
      id
      serverURL
      name
      orderable
      url
      _status
      properties {
        id
        key
        value
      }
    }
    totalDocs
  }
}
