query SearchProductsByCompany(
    $companyId: JSON!
    $searchTerm: String!
    $page: Int = 1
    $limit: Int = 20
    $sort: String = "-contentRankScore"
) {
    Searches(
        draft: false
        where: { AND: [{ title: { contains: $searchTerm } }, { doc: { relationTo: products } }] }
        page: $page
        limit: $limit
        sort: $sort
    ) {
        docs {
            id
            title
            priority
            doc(draft: false) {
                relationTo
                value {
                    ... on Product {
                        __typename
                        id
                        isSubscribed
                        serverURL
                        name
                        description
                        likeCount
                        cryptoAddresses {
                            chain
                            address
                        }
                        url
                        orderable
                        properties {
                            id
                            key
                            value
                        }
                        parameters {
                            id
                            name
                            values {
                                id
                                key
                                name
                                default
                            }
                        }
                        relatedProducts {
                            id
                            name
                            serverURL
                        }
                        image {
                            id
                            url
                            alt
                            filename
                            width
                            height
                            mimeType
                        }
                        company {
                            id
                            serverURL
                            name
                            description
                            cryptoAddresses {
                                chain
                                address
                            }
                            identity {
                                id
                                serverURL
                                name
                                description
                            }
                        }
                    }
                }
            }
        }
        totalDocs
        limit
        totalPages
        page
        hasPrevPage
        hasNextPage
        prevPage
        nextPage
    }
}
