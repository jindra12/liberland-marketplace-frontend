query SearchCompaniesByIdentity($identityId: String!, $searchTerm: String!, $page: Int = 1, $limit: Int = 20, $sort: String = "-priority") {
    Searches(draft: false, where: { AND: [{ title: { contains: $searchTerm } }, { doc: { relationTo: companies } }] }, page: $page, limit: $limit, sort: $sort) {
        docs {
            id
            title
            priority
            doc(draft: false) {
                relationTo
                value {
                    ... on Company {
                        __typename
                        id
                        isSubscribed
                        serverURL
                        name
                        description
                        cryptoAddresses {
                            chain
                            address
                        }
                        website
                        phone
                        email
                        allowedIdentities {
                            id
                            serverURL
                            name
                            description
                        }
                        disallowedIdentities {
                            id
                            serverURL
                            name
                            description
                        }
                        identity {
                            id
                            serverURL
                            name
                            description
                            image {
                                id
                                url
                                alt
                                filename
                                width
                                height
                                mimeType
                            }
                        }
                        image {
                            id
                            url
                            alt
                            filename
                            width
                            height
                            mimeType
                        }
                    }
                }
            }
        }
        totalDocs
        limit
        totalPages
        page
        hasPrevPage
        hasNextPage
        prevPage
        nextPage
    }
}
