query StartupById($id: String!, $draft: Boolean = false) {
    Startup(id: $id, draft: $draft) {
        id
        isSubscribed
        serverURL
        title
        contractDeployments {
            id
            chain
            network
            chainId
            deployedAt
            deploymentBlock
            tokenName
            tokenSymbol
            tokenDecimals
            initialSupply
            deployerWalletAddress
            poolManagerAddress
            positionManagerAddress
            permit2Address
            forwarderAddress
            timelockAddress
            timelockImplementationAddress
            exchangePoolAddress
            exchangePoolId
            tokenAddress
            swapRouterAddress
            rewardTokenAddress
            daoAddress
            tokenImplementationAddress
            swapRouterImplementationAddress
            rewardTokenImplementationAddress
            daoImplementationAddress
        }
        _status
        description
        likeCount
        stage
        lookingFor
        alreadyHave
        fundsNeeded {
            amount
            currency
        }
        company {
            id
            serverURL
            name
            cryptoAddresses {
                chain
                address
            }
            email
        }
        createdBy {
            id
        }
        identity {
            id
            serverURL
            name
            description
            website
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
        }
        image {
            id
            url
            alt
            filename
            width
            height
            mimeType
        }
        involvedUsers {
            id
            name
            email
        }
        createdAt
        updatedAt
    }
}
