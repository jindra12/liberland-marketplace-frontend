mutation CreateProduct($data: mutationProductInput!, $draft: Boolean!) {
    createProduct(data: $data, draft: $draft) {
        id
        name
        cryptoAddresses {
            chain
            address
        }
        _status
        properties {
            id
            key
            value
        }
        parameters {
            id
            name
            values {
                id
                key
                name
                default
            }
        }
        relatedProducts {
            id
            name
            serverURL
        }
        image {
            id
            url
        }
    }
}
