query ListCompaniesByCreator($userId: JSON, $page: Int = 1, $limit: Int = 100) {
  Companies(draft: true, page: $page, limit: $limit, where: { createdBy: { equals: $userId } }) {
    docs {
      id
      serverURL
      name
      cryptoAddresses {
          chain
          address
        }
      _status
    }
    totalDocs
  }
}
