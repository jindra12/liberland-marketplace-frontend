query ProductById($id: String!, $draft: Boolean = false) {
    Product(id: $id, draft: $draft) {
        id
        isSubscribed
        inventory
        likeCount
        enableVariants
        variantTypes {
            id
            label
            name
        }
        variants {
            docs {
                id
                title
                inventory
                priceInUSDEnabled
                priceInUSD
                options {
                    id
                    label
                    value
                }
            }
            hasNextPage
            totalDocs
        }
        priceInUSDEnabled
        priceInUSD
        priceInETH
        priceInSOL
        priceInTRX
        serverURL
        name
        companyIdentityId
        _status
        description
        parameters {
            id
            name
            values {
                id
                key
                name
                default
            }
        }
        relatedProducts {
            id
            name
            serverURL
            isSubscribed
            description
            likeCount
            hasLiked
            inventory
            orderable
            url
            priceInUSDEnabled
            priceInUSD
            priceInETH
            priceInSOL
            priceInTRX
            cryptoAddresses {
                chain
                address
            }
            parameters {
                id
                name
                values {
                    id
                    key
                    name
                    default
                }
            }
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
            company {
                id
                serverURL
                name
                description
                cryptoAddresses {
                    chain
                    address
                }
                identity {
                    id
                    serverURL
                    name
                    description
                }
                image {
                    id
                    url
                    alt
                    filename
                    width
                    height
                    mimeType
                }
            }
        }
        cryptoAddresses {
            chain
            address
        }
        url
        orderable
        properties {
            id
            key
            value
        }
        updatedAt
        createdAt
        deletedAt
        company {
            id
            serverURL
            name
            description
            cryptoAddresses {
                chain
                address
            }
            createdBy {
                id
            }
            identity {
                id
                serverURL
                name
                description
            }
            image {
                id
                url
                filename
                mimeType
                width
                height
            }
        }
        image {
            id
            url
            filename
            width
            height
            mimeType
        }
    }
}
