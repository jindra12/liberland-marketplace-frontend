query ListStartupsByIdentity($identityId: JSON!, $page: Int = 1, $limit: Int = 20, $sort: String) {
  Startups(
    draft: false
    where: { identity: { equals: $identityId } }
    page: $page
    limit: $limit
    sort: $sort
  ) {
    docs {
      id
      isSubscribed
      title
      description
      stage
      identity {
        id
        name
      }
      image {
        id
        url
      }
    }
    totalDocs
    hasNextPage
    nextPage
  }
}
