mutation UpdateUserById($id: String!, $data: mutationUserUpdateInput!) {
    updateUser(id: $id, data: $data) {
        id
        name
        email
        phone
        shippingAddress {
            title
            firstName
            lastName
            company
            addressLine1
            addressLine2
            city
            state
            postalCode
            country
            phone
        }
    }
}
