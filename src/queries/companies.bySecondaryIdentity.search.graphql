query SearchCompaniesBySecondaryIdentity(
  $identityId: JSON!
  $searchTerm: String!
  $page: Int = 1
  $limit: Int = 20
  $sort: String
) {
  Companies(
    draft: false
    where: {
      AND: [
        { name: { contains: $searchTerm } }
        { allowedIdentities: { in: [$identityId] } }
      ]
    }
    page: $page
    limit: $limit
    sort: $sort
  ) {
    docs {
      id
      serverURL
      name
      description
      cryptoAddresses {
        ethereum
        tron
        solana
      }
      website
      phone
      email
      allowedIdentities {
        id
        serverURL
        name
        description
      }
      disallowedIdentities {
        id
        serverURL
        name
        description
      }
      identity {
        id
        serverURL
        name
        description
        image {
          id
          url
          alt
          filename
          width
          height
          mimeType
        }
      }
      image {
        id
        url
        alt
        filename
        width
        height
        mimeType
      }
    }
    totalDocs
    limit
    totalPages
    page
    hasPrevPage
    hasNextPage
    prevPage
    nextPage
  }
}
