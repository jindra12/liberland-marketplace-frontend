query ListProductsByIdentity($identityId: String!, $limit: Int = 50, $page: Int = 1) {
  Products(
    where: { companyIdentityId: { equals: $identityId } }
    sort: "-createdAt"
    limit: $limit
    page: $page
  ) {
    docs {
      id
      serverURL
      name
      cryptoAddresses {
        ethereum
        tron
        solana
      }
      orderable
      url
      companyIdentityId
      company {
        id
        serverURL
        name
        cryptoAddresses {
          ethereum
          tron
          solana
        }
      }
      price {
        amount
        currency
      }
      _status
      createdAt
    }
    totalDocs
    hasNextPage
    nextPage
  }
}
