query ListStartupsByCreator($userId: JSON, $page: Int = 1, $limit: Int = 100, $draft: Boolean = false) {
  Startups(draft: $draft, page: $page, limit: $limit, where: { createdBy: { equals: $userId } }) {
    docs {
      id
      isSubscribed
      serverURL
      title
      _status
    }
    totalDocs
  }
}
