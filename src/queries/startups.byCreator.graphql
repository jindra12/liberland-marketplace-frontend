query ListStartupsByCreator(
    $userId: JSON,
    $page: Int = 1,
    $limit: Int = 100,
    $sort: String = "-contentRankScore",
    $draft: Boolean = false,
) {
    Startups(draft: $draft, page: $page, limit: $limit, sort: $sort, where: { createdBy: { equals: $userId } }) {
        docs {
            id
            isSubscribed
            serverURL
            title
            _status
        }
        totalDocs
    }
}
