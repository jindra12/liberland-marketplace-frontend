query ListIdentities($page: Int = 1, $limit: Int = 20) {
  Identities(draft: false, page: $page, limit: $limit) {
    docs {
      id
      serverURL
      name
      description
      website
      itemCount
      image {
        id
        url
        alt
        filename
        width
        height
        mimeType
      }
    }
    totalDocs
    limit
    totalPages
    page
    hasPrevPage
    hasNextPage
    prevPage
    nextPage
  }
}
