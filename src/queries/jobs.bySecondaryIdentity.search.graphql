query SearchJobsBySecondaryIdentity($identityId: JSON!, $companyIds: [JSON!] = [], $searchTerm: String!, $page: Int = 1, $limit: Int = 20, $sort: String) {
    Jobs(
        draft: false
        where: { AND: [{ title: { contains: $searchTerm } }, { OR: [{ allowedIdentities: { in: [$identityId] } }, { company: { in: $companyIds } }] }, { _status: { equals: published } }] }
        page: $page
        limit: $limit
        sort: $sort
    ) {
        docs {
            id
            isSubscribed
            serverURL
            title
            description
            location
            employmentType
            positions
            postedAt
            isActive
            applyUrl
            bounty {
                amount
                currency
            }
            allowedIdentities {
                id
                serverURL
                name
                description
            }
            disallowedIdentities {
                id
                serverURL
                name
                description
            }
            salaryRange {
                min
                max
                currency
            }
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
            company {
                id
                serverURL
                name
                description
                cryptoAddresses {
                    chain
                    address
                }
                allowedIdentities {
                    id
                    serverURL
                    name
                    description
                }
                disallowedIdentities {
                    id
                    serverURL
                    name
                    description
                }
                identity {
                    id
                    serverURL
                    name
                    description
                }
                image {
                    id
                    url
                    alt
                    filename
                    width
                    height
                    mimeType
                }
            }
        }
        totalDocs
        limit
        totalPages
        page
        hasPrevPage
        hasNextPage
        prevPage
        nextPage
    }
}
