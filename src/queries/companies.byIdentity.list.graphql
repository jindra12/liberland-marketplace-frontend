query ListCompaniesByIdentity($identityId: JSON!, $page: Int = 1, $limit: Int = 20) {
  Companies(
    draft: false
    where: { identity: { equals: $identityId } }
    page: $page
    limit: $limit
  ) {
    docs {
      id
      serverURL
      name
      description
      cryptoAddresses {
          chain
          address
        }
      website
      phone
      email
      allowedIdentities {
        id
        serverURL
        name
        description
      }
      disallowedIdentities {
        id
        serverURL
        name
        description
      }
      identity {
        id
        serverURL
        name
        description
        image {
          id
          url
          alt
          filename
          width
          height
          mimeType
        }
      }
      image {
        id
        url
        alt
        filename
        width
        height
        mimeType
      }
    }
    totalDocs
    limit
    totalPages
    page
    hasPrevPage
    hasNextPage
    prevPage
    nextPage
  }
}
