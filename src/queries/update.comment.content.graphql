mutation UpdateCommentContent($id: String!, $company: String!, $content: String!) {
    updateComment(id: $id, data: { content: $content, company: $company }) {
        id
        content
        updatedAt
        company {
            id
            serverURL
            name
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
        }
    }
}
