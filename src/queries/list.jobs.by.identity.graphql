query ListJobsByIdentity($identityId: String!, $limit: Int = 50, $page: Int = 1, $sort: String = "-contentRankScore") {
    Jobs(
        draft: false
        where: { AND: [{ companyIdentityId: { equals: $identityId } }, { _status: { equals: published } }] }
        limit: $limit
        page: $page
        sort: $sort
    ) {
        docs {
            id
            isSubscribed
            serverURL
            title
            description
            hasLiked
            likeCount
            companyIdentityId
            positions
            isActive
            applyUrl
            bounty {
                amount
                currency
            }
            allowedIdentities {
                id
                serverURL
                name
                description
            }
            disallowedIdentities {
                id
                serverURL
                name
                description
            }
            company {
                id
                serverURL
                name
                description
                cryptoAddresses {
                    chain
                    address
                }
                allowedIdentities {
                    id
                    serverURL
                    name
                    description
                }
                disallowedIdentities {
                    id
                    serverURL
                    name
                    description
                }
                identity {
                    id
                    serverURL
                    name
                    description
                }
                image {
                    id
                    url
                    alt
                    filename
                    width
                    height
                    mimeType
                }
            }
            location
            employmentType
            salaryRange {
                min
                max
                currency
            }
            image {
                id
                url
                alt
                filename
                width
                height
                mimeType
            }
            postedAt
            _status
        }
        totalDocs
        hasNextPage
        nextPage
    }
}
