query ListJobsByIdentity($identityId: String!, $limit: Int = 50, $page: Int = 1, $sort: String = "-contentRankScore") {
    Jobs(
        draft: false
        where: { AND: [{ companyIdentityId: { equals: $identityId } }, { _status: { equals: published } }] }
        limit: $limit
        page: $page
        sort: $sort
    ) {
        docs {
            id
            isSubscribed
            serverURL
            title
            hasLiked
            likeCount
            companyIdentityId
            company {
                id
                serverURL
                name
                cryptoAddresses {
                    chain
                    address
                }
                image {
                    id
                    url
                }
            }
            location
            employmentType
            salaryRange {
                min
                max
                currency
            }
            image {
                id
                url
            }
            postedAt
            _status
        }
        totalDocs
        hasNextPage
        nextPage
    }
}
