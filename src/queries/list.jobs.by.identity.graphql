query ListJobsByIdentity($identityId: String!, $limit: Int = 50, $page: Int = 1) {
  Jobs(
    where: { companyIdentityId: { equals: $identityId } }
    sort: "-postedAt"
    limit: $limit
    page: $page
  ) {
    docs {
      id
      title
      companyIdentityId
      company {
        id
        name
      }
      location
      employmentType
      postedAt
      _status
    }
    totalDocs
    hasNextPage
    nextPage
  }
}
