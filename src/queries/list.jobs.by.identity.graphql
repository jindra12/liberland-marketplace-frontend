query ListJobsByIdentity($identityId: String!, $limit: Int = 50, $page: Int = 1) {
  Jobs(
    draft: false
    where: { companyIdentityId: { equals: $identityId } }
    sort: "-postedAt"
    limit: $limit
    page: $page
  ) {
    docs {
      id
      title
      companyIdentityId
      company {
        id
        name
        image {
          id
          url
        }
      }
      location
      employmentType
      salaryRange {
        min
        max
        currency
      }
      image {
        id
        url
      }
      postedAt
      _status
    }
    totalDocs
    hasNextPage
    nextPage
  }
}
