query ListProducts($page: Int = 1, $limit: Int = 20, $sort: String) {
  Products(draft: false, page: $page, limit: $limit, sort: $sort) {
    docs {
      id
      serverURL
      name
      inventory
      description
      cryptoAddresses {
          chain
          address
        }
      url
      orderable
      priceInUSDEnabled
      priceInUSD
      priceInETH
      priceInSOL
      priceInTRX
      properties {
        id
        key
        value
      }
      image {
        id
        url
        alt
        filename
        width
        height
        mimeType
      }
      company {
        id
        serverURL
        name
        description
        cryptoAddresses {
          chain
          address
        }
        identity {
          id
          serverURL
          name
          description
        }
        image {
          id
          url
          alt
          filename
          width
          height
          mimeType
        }
      }
    }
    totalDocs
    limit
    totalPages
    page
    hasPrevPage
    hasNextPage
    prevPage
    nextPage
  }
}
